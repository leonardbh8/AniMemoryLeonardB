<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
</head>
<body>
    <h1>Se connecter</h1>
     <fieldset>
      <legend>Texte :</legend>
      <form action="" method="post">
       <label for="email">Email* :</label>
        <input
          type="text"
          id="email"
          name="email"
          required
          placeholder="john.doe@example.com"
        />
        <br />
        <br />
        <label for="motdePasse">Mot de passe :</label>
        <input
          type="password"
          id="motdePasse"
          name="motdePasse"
          required
          title="Saisissez votre mot de passe"
        />
        <br />
        <br />
        <input type="reset" />
        <input type="submit" />
      </form>
    </fieldset>
    
</body>
</html>
