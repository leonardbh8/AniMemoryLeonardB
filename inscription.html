<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="h1ins">
      <h1>ENi - Memory - S'inscrire</h1
    </div>
    <header>
    <div class="inscription">
      <h2>Inscrivez-vous</h2>
    
       <nav class="navbar navbar-expand d-inline-flex bg-dark px-2 py-1 rounded border border-secondary ms-3"data-bs-theme="dark">
        <div class="navbar-nav">
          <a class="nav-link px-3" href="index.html">Accueil</a>
          <a class="nav-link px-3 active bg-black rounded" href="inscription.html">S'inscrire</a>
          <a class="nav-link px-3" href="connection.html">Se connecter</a>
          <a class="nav-link px-3" href="profil.html">Profil</a>
          <a class="nav-link px-3" href="jouer.html">Jouer</a>
        </div>
      </nav>
    </br>
    </br>
    </header>
    <main class="container my-4">
    <div class="row">
    <div class="col-50 col-lg-20 mx-auto">  
      <fieldset>
        
        <div class="card text-bg-dark rounded-4 p-4">
        <form action="" method="post" id="formInscription">
          <label for="nom">Nom d'utilisateur* :</label>
          <input
            type="text"
            id="nom"
            name="nom"
            autofocus
            required
            placeholder="DOE"
            pattern="[A-Za-Z]{2,}"
            title="Saisissez votre nom (2 caractères min.)"
          />
          <br />
          <br />
          <label for="email">Email* :</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="john.doe@example.com"
          />
          <br />
          <br />

          <label for="motdePasse">Mot de passe :</label>
          <input
            type="password"
            id="motdePasse"
            name="motdePasse"
            required
            title="Saisissez votre mot de passe"
          />
          <br />
          <br />
          <label for="confirmmotdePasse">Confirmer le mot de passe :</label>
          <input
            type="password"
            id="confirmmotdePasse"
            name="confirmmotdePasse"
            required
            title="Confirmez votre mot de passe"
          />
          <br />
          <br />
          <div class="d-flex justify-content-center gap-5">
            <button>Création du compte</button>
            <button>Annuler</button>
          </div>
        </form>
        </div>
        <p>* champ obligatoire</p>
      </fieldset>
    </div>
    </div>
    </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="inscription.js"></script>

  </body>
</html>
